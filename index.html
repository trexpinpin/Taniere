<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Tanière PinpinRex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe6;--card:#fffdf8;--ink:#1f1d1a;--muted:#7b7468;--line:#e3dccd;
  --accent:#2d6a4c;--accent-ink:#fff;--accent-soft:#dbeadf;
  --warn:#c1502c;--warn-soft:#f6e0d5;--gold:#b98a23;--gold-soft:#f5ead0;
  --p1:#2f5d8a;--p1-soft:#dce7f2;--p2:#a2456e;--p2-soft:#f2dde7;
  --d-courses:#2d6a4c;--d-divers:#c9a03c;--d-travaux:#6d55b0;--d-factures:#c1502c;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 14px rgba(40,30,10,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141311;--card:#1f1d1a;--ink:#f2eee5;--muted:#a59e92;--line:#34302a;
  --accent:#6cc095;--accent-ink:#0f1f17;--accent-soft:#1e3629;
  --warn:#ec8c69;--warn-soft:#3b2219;--gold:#e0b453;--gold-soft:#3a2f17;
  --p1:#8fb8e3;--p1-soft:#1c2b3b;--p2:#e39abd;--p2-soft:#3a1f2c;
  --d-courses:#6cc095;--d-divers:#e0b453;--d-travaux:#a892e8;--d-factures:#ec8c69;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque",Inter,sans-serif;margin:0;letter-spacing:-.01em}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;display:flex;align-items:center;gap:10px}
.top h1{font-size:24px;font-weight:800;flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--accent)}.dot.bad{background:var(--warn)}
main{padding:4px 14px calc(env(safe-area-inset-bottom) + 96px);max-width:640px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;
  background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;border-radius:12px;position:relative}
nav.tabs a span{display:block;font-size:20px;line-height:1.15}
nav.tabs a.on{color:var(--accent);background:var(--accent-soft)}
nav.tabs a .pip{position:absolute;top:4px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:10px 0}
.card h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn);border-color:var(--warn-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{display:block;width:100%;text-align:left;margin:6px 0}
.btn:disabled{opacity:.5}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.addbar{display:flex;gap:8px;position:sticky;top:calc(env(safe-area-inset-top) + 54px);z-index:10;background:var(--bg);padding:6px 0}
.addbar .qty{width:70px}
.addbar .btn{font-size:20px;padding:6px 16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 4px 6px;font-family:Inter}
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:6px 0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--accent-ink)}
.item.done{opacity:.55}.item.done .check{background:var(--accent);border-color:var(--accent)}
.item.done .nm{text-decoration:line-through}
.nm{font-weight:600}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--bg);color:var(--muted)}
.b-p1{background:var(--p1-soft);color:var(--p1)}.b-p2{background:var(--p2-soft);color:var(--p2)}
.b-ok{background:var(--accent-soft);color:var(--accent)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-gold{background:var(--gold-soft);color:var(--gold)}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
.hint{font-size:12px;color:var(--muted)}
.hint b{color:var(--accent)}
.summary{display:flex;gap:10px}
.summary .card{flex:1;margin:6px 0;padding:12px;min-width:0}
.kpi{font-family:"Bricolage Grotesque";font-size:24px;font-weight:800;white-space:nowrap}
.monthbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0}
.monthbar span{font-family:"Bricolage Grotesque";font-weight:700;font-size:18px;min-width:150px;text-align:center;text-transform:capitalize}
.monthbar button{border:1px solid var(--line);background:var(--card);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
.rec{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--bg) center/cover;flex:none;display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.amt{font-family:"Bricolage Grotesque";font-weight:800;font-size:18px;white-space:nowrap}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:25;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-weight:700;padding:14px 20px;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer;font-size:15px}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.over i{background:var(--warn)}
.hbars .r{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}
.hbars .r .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbars{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:10px}
.vbars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.vbars .c .st{width:100%;max-width:38px;display:flex;flex-direction:column-reverse;border-radius:8px 8px 4px 4px;overflow:hidden;min-height:2px;background:var(--line)}
.vbars .c .st i{display:block;width:100%}
.vbars .c.cur small{color:var(--ink);font-weight:700}
.vbars .c small{font-size:10.5px;color:var(--muted)}
.vbars .c b{font-size:10px;color:var(--muted);font-weight:600;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.split{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--bg);margin:8px 0}
.split i{display:block;height:100%}
.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty div{font-size:38px;margin-bottom:6px}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;cursor:pointer;min-width:0}
.ucard .ic{font-size:22px}
.ucard .nm{font-size:14px;margin-top:2px}
.ucard.add{border-style:dashed;display:grid;place-items:center;color:var(--muted);font-weight:600;box-shadow:none;background:transparent;min-height:120px}
.spark{display:flex;align-items:flex-end;gap:2px;height:28px;margin-top:8px}
.spark i{flex:1;background:var(--accent-soft);border-radius:2px;min-height:2px}
.spark i.on{background:var(--accent)}
.proj .top2{display:flex;align-items:center;gap:8px}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,8,5,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .2s ease-out}
.sheet .hd{display:flex;align-items:center;gap:8px;position:sticky;top:-16px;background:var(--card);padding:6px 0 10px;z-index:2}
.sheet .hd h2{flex:1;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fade{from{opacity:0}}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:10px;font-weight:600;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.photo{border:2px dashed var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer;position:relative}
.photo img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin:0 auto}
.photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lines .ln{display:grid;grid-template-columns:1fr 54px 80px 26px;gap:6px;margin:6px 0}
.lines .ln input{padding:8px}
.totline{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.ai{background:linear-gradient(135deg,var(--gold-soft),var(--accent-soft));border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 140px);transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:fade .2s}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:14px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
table.t th{font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t tr[data-act]{cursor:pointer}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin:8px 0}
.banner.info{background:var(--gold-soft);color:var(--gold)}
.banner .btn{margin-left:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:18px 4px 4px}
.sec-title h2{font-size:17px}
.fileBtn{position:relative;overflow:hidden}
.fileBtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.who{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px 4px 6px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px}
.who span{font-size:18px;line-height:1}
.item .nm{cursor:pointer}
.promo{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#ffe3d6;color:#b3401b;margin-top:3px}
@media (prefers-color-scheme:dark){.promo{background:#4a2516;color:#ffb08f}}
.settle{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.settle.ok{background:var(--accent-soft);color:var(--accent)}
.settle.due{background:var(--gold-soft);color:var(--gold)}
.tx{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--muted)}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.bigchoice button{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:22px 10px;font-weight:800;font-size:18px;cursor:pointer;font-family:"Bricolage Grotesque",Inter,sans-serif}
.bigchoice button.on{border-color:var(--accent);background:var(--accent-soft)}
.bigchoice button span{display:block;font-size:46px}
.paybox{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:14px}
.paybox input,.paybox select{background:var(--card)}
@media (max-width:480px){#syncTxt{display:none}.top h1{font-size:21px}}
.chart{width:100%;height:120px;display:block}
.chart text{font-size:10px;fill:var(--muted)}
.srow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.srow .chip{padding:5px 10px;font-size:12.5px}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}
.hero{background:linear-gradient(135deg,var(--accent-soft),var(--card));}
.hero .kpi{font-size:34px}
.env{margin:10px 0}
.env .top3{display:flex;align-items:baseline;gap:8px;font-size:14px}
.env .top3 .lb{flex:1;font-weight:600}
.env .bar{height:9px;margin-top:4px}
.env .bar i.mid{background:var(--gold)}
.env .bar i.hi{background:var(--warn)}
.env .pace{position:relative}
.env .pace b{position:absolute;top:-2px;width:2px;height:13px;background:var(--ink);opacity:.35}
.iconpick{display:flex;gap:6px;flex-wrap:wrap}
.iconpick button{font-size:22px;border:2px solid var(--line);background:var(--bg);border-radius:12px;width:44px;height:44px;cursor:pointer}
.iconpick button.on{border-color:var(--accent);background:var(--accent-soft)}
.btx{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0}
.btx.done{opacity:.55}
.btx .l1{display:flex;gap:8px;align-items:flex-start}
.btx .l1 input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none}
.btx select{padding:7px 8px;font-size:13px;margin-top:6px}
.neg{color:var(--warn)}.pos{color:var(--accent)}
.wdays{font-family:"Bricolage Grotesque";font-weight:800;font-size:20px;text-align:right;white-space:nowrap}
</style>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2d6a4c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
</head>
<body>
<header class="top">
  <h1>La Tanière <span style="white-space:nowrap">🐧🦖</span></h1>
  <button class="who" data-act="openSearch" aria-label="Rechercher" style="padding:4px 9px"><span style="font-size:16px">🔎</span></button><button class="who" id="whoChip" data-act="whoSheet" style="display:none"></button><div class="sync"><i class="dot" id="syncDot"></i><span id="syncTxt">Connexion…</span></div>
</header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <a href="#liste" data-v="liste"><span>📝</span>Liste</a>
  <a href="#courses" data-v="courses"><span>🛒</span>Courses</a>
  <a href="#travaux" data-v="travaux"><span>🏠</span>Maison</a>
  <a href="#factures" data-v="factures"><span>📄</span>Factures</a>
  <a href="#bilan" data-v="bilan"><span>💰</span>Budget</a>
</nav>

<script src="./config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="./host.js"></script>
<script>
/* ================= utils ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(num(n) * 100) / 100;
const eur = n => (Number(n) || 0).toLocaleString('fr-BE', {style:'currency', currency:'EUR'});
const eur0 = n => (Number(n) || 0).toLocaleString('fr-BE', {style:'currency', currency:'EUR', maximumFractionDigits:0});
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '');
const MONTHS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MSHORT = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
const MINI = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const monthLabel = k => { const [y, m] = k.split('-'); return MONTHS[+m - 1] + ' ' + y; };
const shiftMonth = (k, d) => { let [y, m] = k.split('-').map(Number); m += d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return y + '-' + pad(m); };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = s.split('-'); return +d + ' ' + MSHORT[+m - 1] + (y !== String(new Date().getFullYear()) ? ' ' + y : ''); };
const shiftDays = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const daysAgo = ts => Math.floor((Date.now() - ts) / 86400000);
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, ms = 2600) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms); return t;
}
function confirmBox(msg, okLabel = 'Confirmer') {
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov'; ov.style.alignItems = 'center'; ov.style.zIndex = 85;
    ov.innerHTML = `<div class="sheet" style="border-radius:22px;margin:auto 12px;max-width:420px">

function priceChart(buys) {
  const pts = [...buys].reverse().slice(-24); if (pts.length < 2) return '';
  const W = 340, H = 120, P = 26; const vals = pts.map(b => b.unit); const mn = Math.min(...vals), mx = Math.max(...vals); const rg = mx - mn || 1;
  const x = i => P + i * (W - P - 8) / (pts.length - 1), y = v => 10 + (H - 30) * (1 - (v - mn) / rg);
  const stores = [...new Set(pts.map(b => b.store))]; const cols = ['var(--d-courses)', 'var(--d-travaux)', 'var(--d-factures)', 'var(--d-divers)', 'var(--p1)', 'var(--p2)'];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <text x="0" y="${y(mx) + 3}">${mx.toFixed(2)}</text><text x="0" y="${y(mn) + 3}">${mn.toFixed(2)}</text>
    <polyline fill="none" stroke="var(--line)" stroke-width="2" points="${pts.map((b, i) => x(i) + ',' + y(b.unit)).join(' ')}"/>
    ${pts.map((b, i) => `<circle cx="${x(i)}" cy="${y(b.unit)}" r="4" fill="${cols[stores.indexOf(b.store) % cols.length]}"><title>${esc(b.store)} · ${fmtDate(b.date)} · ${b.unit.toFixed(2)} €</title></circle>`).join('')}
    <text x="${P}" y="${H - 4}">${fmtDate(pts[0].date)}</text><text x="${W - 8}" y="${H - 4}" text-anchor="end">${fmtDate(pts[pts.length - 1].date)}</text></svg>
    <div class="legend">${stores.map((st, i) => `<span><i style="background:${cols[i % cols.length]}"></i>${esc(st)}</span>`).join('')}</div>`;
}

  h += [...R.map(r => [r.date, recCard(r)]), ...T.map(x => [x.date, trCard(x)])].sort((a, b) => (b[0] || '').localeCompare(a[0] || '')).slice(0, 120).map(x => x[1]).join('');
  if (!R.length && !T.length) h += `<div class="empty small">Rien trouvé. Essaie un autre mot ou élargis la période.</div>`;
  res.innerHTML = h;
}

/* ================= FACTURES ================= */
function utilStats(key, year) {
  const recs = state.receipts.filter(r => r.kind === 'facture' && r.util === key);
  const inY = y => recs.filter(r => (r.date || '').startsWith(String(y)));
  const cur = inY(year), prev = inY(year - 1);
  const months = Array(12).fill(0); cur.forEach(r => months[+r.date.slice(5, 7) - 1] += num(r.total));
  const sum = a => a.reduce((s, r) => s + num(r.total), 0);
  const withC = cur.filter(r => num(r.conso) > 0);
  const conso = withC.reduce((s, r) => s + num(r.conso), 0);
  const consoCost = sum(cur);
  const isCurYear = year === new Date().getFullYear();
  const prevSame = isCurYear ? prev.filter(r => r.date.slice(5) <= today().slice(5)) : prev;
  return {recs, cur, total: sum(cur), prevTotal: sum(prev), prevSame: sum(prevSame), months, conso, unitCost: conso && consoCost > 0 ? consoCost / conso : 0,
          regul: sum(cur.filter(r => r.ftype === 'regul')), last: recs[0]};
}

    const R = state.receipts.filter(hit), T = state.transfers.filter(hit);

      `<div class="empty">Rien trouvé pour « ${esc(state.txQ)} »</div>`;

  }
  const fact = state.receipts.filter(r => r.kind === 'facture');
  const unpaid = fact.filter(r => !r.paid).sort((a, b) => (a.due || a.date || '').localeCompare(b.due || b.date || ''));
  const yr = fact.filter(r => (r.date || '').startsWith(String(state.year)));
  const total = yr.reduce((s, r) => s + num(r.total), 0);
  const isCur = state.year === new Date().getFullYear();
  const prevSame = fact.filter(r => (r.date || '').startsWith(String(state.year - 1)) && (!isCur || r.date.slice(5) <= today().slice(5))).reduce((s, r) => s + num(r.total), 0);
  const monthsElapsed = isCur ? new Date().getMonth() + 1 : 12;
  let h = `<div class="summary">
    <div class="card"><div class="small muted">Total ${state.year}</div><div class="kpi">${eur0(total)}</div>
      ${prevSame ? `<div class="small" style="font-weight:700;color:${total > prevSame ? 'var(--warn)' : 'var(--accent)'}">${total > prevSame ? '▲' : '▼'} ${Math.abs((total - prevSame) / prevSame * 100).toFixed(0)} % vs ${state.year - 1}${isCur ? ' (même période)' : ''}</div>` : '<div class="small muted">—</div>'}</div>
    <div class="card"><div class="small muted">Moyenne / mois</div><div class="kpi">${eur0(total / monthsElapsed)}</div><div class="small muted">${yr.length} facture${yr.length > 1 ? 's' : ''}</div></div></div>`;
  if (unpaid.length) {

  }

  for (const k of used) {

    h += `<div class="ucard" data-act="openUtil" data-k="${k}"><div class="row"><span class="ic">${ic}</span><span class="grow"></span>${s.recs.some(r => !r.paid) ? '<span class="badge b-warn">à payer</span>' : ''}</div>

      <div class="small muted">${s.prevSame ? `<span style="color:${s.total > s.prevSame ? 'var(--warn)' : 'var(--accent)'};font-weight:700">${s.total > s.prevSame ? '▲' : '▼'} ${Math.abs((s.total - s.prevSame) / s.prevSame * 100).toFixed(0)} %</span> vs ${state.year - 1}` : s.last ? 'dernière : ' + eur(s.last.total) : ''}</div>
      ${s.conso ? `<div class="small muted">${Math.round(s.conso).toLocaleString('fr-BE')} ${esc(unit)}${s.unitCost ? ' · ' + s.unitCost.toFixed(3).replace('.', ',') + ' €/' + esc(unit) : ''}</div>` : ''}
      <div class="spark">${s.months.map((v, i) => `<i class="${i === curM ? 'on' : ''}" style="height:${v / mx * 100}%"></i>`).join('')}</div></div>`;
  }
  h += `<div class="ucard add" data-act="newRec" data-kind="facture">＋ Ajouter<br>un poste</div></div>`;
  if (!fact.length) h += `<div class="empty">Ajoute vos factures de gaz, électricité, eau, internet, GSM… (acomptes et régularisations).<br>Elles seront regroupées par poste et comparées d'une année à l'autre.</div>`;
  body.innerHTML = h;
}
/* ================= PRÉLÈVEMENTS (vue simple) ================= */
function prelevRows(m) {
  const dim = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
  return state.recurring.filter(rc => (!rc.type || rc.type === 'facture') && rc.active !== false && (rc.start || '') <= m && (!rc.end || rc.end >= m) && !(rc.skip || []).includes(m))
    .map(rc => {
      const rid = `auto-${rc.id}-${m}`; const r = state.receipts.find(x => x.id === rid);
      const base = r || {id: rid, total: rc.amount, payer: rc.payer, split: rc.split, pctP1: rc.pctP1};
      return {rc, rid, r, total: num(base.total), st: settleOf(base), date: m + '-' + pad(Math.min(Math.max(1, Math.round(num(rc.day) || 1)), dim))};
    }).sort((a, b) => a.date.localeCompare(b.date));
}

  const clean = o => { const c = {...o}; delete c.id; delete c._ts; return c; };
  const photoFiles = zip ? Object.keys(zip.files).filter(k => k.startsWith('photos/')) : [];
  for (const p of P) { if (p?.id) await write(() => db.collection('projects').doc(String(p.id)).set(clean(p))); t.textContent = `Restauration ${++n}/${total}…`; }
  for (const r of R) {
    if (!r?.id) continue; const doc = clean(r);
    if (doc.photo && zip && assets) {
      let ok = false; try { ok = await PH.exists(doc.photo); } catch {}
      if (!ok) { const f = photoFiles.find(k => k.includes('__' + doc.photo + '.')); if (f) { try { const b = await zip.file(f).async('blob'); const a = await assets.upload(new Blob([b], {type: 'image/jpeg'})); doc.photo = a.id; photos++; } catch {} } }
    }
    await write(() => db.collection('receipts').doc(String(r.id)).set(doc)); t.textContent = `Restauration ${++n}/${total}…`;
  }
  for (const i of I) { if (i?.id) await write(() => db.collection('items').doc(String(i.id)).set(clean(i))); t.textContent = `Restauration ${++n}/${total}…`; }
  for (const [c, arr] of extra) for (const x of arr) { if (x?.id) await write(() => db.collection(c).doc(String(x.id)).set(clean(x))); t.textContent = `Restauration (${c})…`; }

}

/* ================= COPIES AUTOMATIQUES ================= */
let snapBusy = false;
const SNAP_EVERY = 1, SNAP_DAILY = 14, SNAP_MONTHLY = 6, CHUNK = 90000;
async function quiet(fn) { try { await fn(); return true; } catch { return false; } }
async function autoSnapshot(force) {
  if (snapBusy || !db) return;
  const L = state.loaded; if (!(L.items && L.receipts && L.projects && L.snaps)) return;
  if (!state.receipts.length && !state.projects.length && !state.items.length) return;
  const last = Math.max(0, ...state.snaps.map(x => x.at || 0));
  if (!force && last && new Date(last).toISOString().slice(0, 10) === new Date().toISOString().slice(0, 10)) return;
  snapBusy = true;
  try {
    const id = today(); const json = JSON.stringify(backupData()); const n = Math.max(1, Math.ceil(json.length / CHUNK));
    for (let i = 0; i < n; i++) if (!(await quiet(() => db.doc(`snapshots/${id}/parts/p${pad(i)}`).set({s: json.slice(i * CHUNK, (i + 1) * CHUNK)})))) return;
    const meta = {at: Date.now(), by: state.me, parts: n, size: json.length, counts: {receipts: state.receipts.length, projects: state.projects.length, items: state.items.length, photos: state.receipts.filter(r => r.photo).length}};
    if (!(await quiet(() => db.doc('snapshots/' + id).set(meta)))) return;
    const all = [...state.snaps.filter(x => x.id !== id), {id, ...meta}].sort((a, b) => b.at - a.at);
    const keep = new Set(all.slice(0, SNAP_DAILY).map(x => x.id));
    const byMonth = {}; all.forEach(x => { byMonth[x.id.slice(0, 7)] = x; });  // all is newest first → last write = oldest of the month
    Object.keys(byMonth).sort().reverse().slice(0, SNAP_MONTHLY).forEach(m => keep.add(byMonth[m].id));
    for (const old of all.filter(x => !keep.has(x.id))) {
      for (let i = 0; i < (old.parts || 1); i++) await quiet(() => db.doc(`snapshots/${old.id}/parts/p${pad(i)}`).delete());
      await quiet(() => db.doc('snapshots/' + old.id).delete());
    }
    if (force) toast('Copie créée ✓');
  } finally { snapBusy = false; }
}
async function loadSnapshot(id) {
  const meta = state.snaps.find(x => x.id === id); if (!meta) throw new Error('copie introuvable');
  const q = await db.collection(`snapshots/${id}/parts`).get();
  const parts = q.docs.map(d => [d.id, d.data()?.s || '']).sort((a, b) => a[0].localeCompare(b[0]));
  if (parts.length < (meta.parts || 1)) throw new Error('copie incomplète');
  return JSON.parse(parts.map(x => x[1]).join(''));
}
function renderSnaps() {
  const box = $('#snapBox'); if (!box) return;
  const list = [...state.snaps].sort((a, b) => b.at - a.at);
  const doneToday = list.length && new Date(list[0].at).toISOString().slice(0, 10) === new Date().toISOString().slice(0, 10);
  box.innerHTML = `<div class="small muted">Chaque jour, à la première ouverture de l'appli par l'un de vous deux, une copie de vos données est enregistrée (sans les photos, qui restent stockées dans l'appli). On garde les ${SNAP_DAILY} derniers jours + une copie par mois sur ${SNAP_MONTHLY} mois.</div>
    ${list.length ? `<table class="t" style="margin-top:8px">${list.slice(0, 20).map(x => `<tr><td>${fmtDate(new Date(x.at).toISOString().slice(0, 10))}<div class="small muted">${x.counts?.receipts ?? '?'} tickets/factures · ${x.counts?.projects ?? '?'} projets${x.by ? ' · ' + esc(pname(x.by)) : ''}</div></td>
      <td class="n"><button class="btn sm" data-act="snapDl" data-id="${esc(x.id)}" title="Télécharger">⬇️</button> <button class="btn sm" data-act="snapRestore" data-id="${esc(x.id)}">Restaurer</button></td></tr>`).join('')}</table>
      <div class="row" style="margin-top:10px"><span class="small muted grow">${doneToday ? 'Copie du jour faite ✓' : 'Copie du jour à la prochaine ouverture'}</span><button class="btn sm" data-act="snapNow">Copier maintenant</button></div>`
    : `<div class="row" style="margin-top:10px"><span class="small muted grow">Aucune copie pour l'instant.</span><button class="btn sm" data-act="snapNow">Copier maintenant</button></div>`}`;
}

async function compress(file, max = 1600, q = 0.82) {
  try {
    let src;
    try { src = await createImageBitmap(file); }
    catch { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
    const w = src.width, hgt = src.height, s = Math.min(1, max / Math.max(w, hgt));
    const c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(hgt * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    return (await new Promise(res => c.toBlob(res, 'image/jpeg', q))) || file;
  } catch { return file; }
}
async function onPhoto(e) {

  draft._blob = await compress(f);
  if (draft._preview) URL.revokeObjectURL(draft._preview);
  draft._preview = URL.createObjectURL(draft._blob);
  renderPhoto(); renderAI();
  if (!assets) toast("La photo sert à la lecture mais ne sera pas stockée.", 3500);

let genBusy = false, genAgain = false, genTimer = null;
const scheduleGen = () => { clearTimeout(genTimer); genTimer = setTimeout(genRecurring, 1500); };
async function genRecurring() {
  if (!db) return; const L = state.loaded; if (!(L.receipts && L.transfers && L.recurring && L.incomes)) return;
  if (genBusy) { genAgain = true; return; } genBusy = true;
  let created = 0;
  try {
    const t = today(), curM = t.slice(0, 7), minM = shiftMonth(curM, -23);
    const haveR = new Set(state.receipts.map(r => r.id)), haveT = new Set(state.transfers.map(x => x.id)), haveI = new Set(state.incomes.map(x => x.id));
    for (const rc of state.recurring) {
      if (rc.active === false || !/^\d{4}-\d{2}$/.test(rc.start || '') || !(num(rc.amount) > 0)) continue;
      for (let m = rc.start < minM ? minM : rc.start; m <= curM && created < 80; m = shiftMonth(m, 1)) {
        if (rc.end && m > rc.end) break;
        if ((rc.skip || []).includes(m)) continue;
        const dim = new Date(+m.slice(0, 4), +m.slice(5, 7), 0).getDate();
        const date = m + '-' + pad(Math.min(Math.max(1, Math.round(num(rc.day) || 1)), dim)); if (rc.type === 'virement' && date > t) continue;
        const id = `auto-${rc.id}-${m}`;
        if (rc.type === 'revenu') {
          if (haveI.has(id)) continue;
          if (await quiet(() => db.collection('incomes').doc(id).set({who: rc.who || 'p1', label: rc.label || '', cat: rc.cat || 'salaire', amount: r2(rc.amount), date, note: '', auto: true, recId: rc.id, by: 'auto', createdAt: Date.now()}))) { created++; haveI.add(id); }
        } else if (rc.type === 'virement') {
          if (haveT.has(id)) continue;
          if (await quiet(() => db.collection('transfers').doc(id).set({from: rc.from, to: other(rc.from), amount: r2(rc.amount), date, txRef: '', mode: 'virement', note: rc.label || 'Ordre permanent',
            rid: rc.forRec ? `auto-${rc.forRec}-${m}` : '', auto: true, recId: rc.id, by: 'auto', createdAt: Date.now()}))) { created++; haveT.add(id); }
        } else {
          if (haveR.has(id)) continue;
          if (await quiet(() => db.collection('receipts').doc(id).set({kind: 'facture', util: rc.util || 'autre', store: rc.store || '', date, total: r2(rc.amount), ftype: rc.ftype || 'acompte',
            payer: rc.payer || 'commun', mode: 'domiciliation', split: rc.split || 'half', pctP1: num(rc.pctP1), ref: rc.ref || '', txRef: '', paid: true, due: '', lines: [], note: 'Prélèvement automatique',
            photo: null, auto: true, recId: rc.id, by: 'auto', createdAt: Date.now(), updatedAt: Date.now()}))) { created++; haveR.add(id); }
        }
      }
    }
    if (created) toast(`🔁 ${created} opération(s) automatique(s) ajoutée(s)`);
  } finally { genBusy = false; if (genAgain) { genAgain = false; scheduleGen(); } }
}

      const ov = $('#incOv'); const i = state.incomes.find(x => x.id === ov.dataset.id); if (!i) return;
      if (!(await confirmBox('Supprimer ce revenu ? (récupérable dans la corbeille)', 'Supprimer'))) return;
      const {id: _i, ...data} = i;
      if (await moveToTrash('incomes', i.id, data, `Revenu : ${i.label || ''} · ${fmtDate(i.date)} · ${eur(i.amount)}`)) { if (i.recId) await skipAuto(i.recId, i.id); closeSheet('incOv'); toast('Mis à la corbeille'); }
      break; }
    case 'newGoal': openGoal(null); break;
    case 'openGoal': { const g = state.goals.find(x => x.id === id); if (g) openGoal(g); break; }
    case 'saveGoal': saveGoal(); break;
    case 'delGoal': {
      const ov = $('#goalOv'); const g = state.goals.find(x => x.id === ov.dataset.id); if (!g) return;
      if (!(await confirmBox(`Supprimer l'objectif « ${g.name} » et son historique ? (récupérable dans la corbeille)`, 'Supprimer'))) return;
      const {id: _i, ...data} = g;
      if (await moveToTrash('goals', g.id, data, `Objectif : ${g.name} · ${eur(goalSaved(g))}`)) { closeSheet('goalOv'); toast('Mis à la corbeille'); }
      break; }
    case 'goalMove': openMove(id, +el.dataset.dir); break;
    case 'saveMove': saveMove(); break;
    case 'delMove': {
      const g = state.goals.find(x => x.id === el.dataset.g); if (!g) return;
      if (!(await confirmBox('Supprimer ce mouvement ?', 'Supprimer'))) return;
      if (await write(() => db.doc('goals/' + g.id).update({moves: (g.moves || []).filter(mv => mv.id !== el.dataset.m)}))) { closeSheet('goalOv'); setTimeout(() => openGoal(state.goals.find(x => x.id === g.id)), 300); }
      break; }
    case 'openBudgets': openBudgets(); break;
    case 'budSuggest': { let n = 0; $$('[data-bud]').forEach(i => { const a = num(i.dataset.avg); if (!num(i.value) && a) { i.value = Math.ceil(a * 1.05 / 10) * 10; n++; } }); toast(n ? `${n} budget(s) proposé(s) : vérifie-les` : 'Rien à proposer : les cases vides n\'ont pas de dépenses récentes'); } $('#budOv').dispatchEvent(new Event('input')); break;
    case 'saveBudgets': {
      const budgets = {}; $$('[data-bud]').forEach(i => { const v = r2(i.value); if (v > 0) budgets[i.dataset.bud] = v; });
      await saveSettings({budgets, budget: budgets.courses || 0}); closeSheet('budOv'); toast('Budgets enregistrés ✓'); refresh(); break; }
    case 'openPrelevs': state.factSeg = 'prelev'; location.hash = 'factures'; break;
    case 'sFilt': state.srch[el.dataset.f] = el.dataset.v; renderSearch(); break;
    case 'catCat': state.catCat = el.dataset.c; renderPrices(); break;
    case 'pdBest': $('#pdStore').value = el.dataset.s; break;
    case 'pdSave': {
      const k = el.dataset.k;
      if (await saveProduct(k, {name: $('#pdName').value.trim().slice(0, 80), cat: $('#pdCat').value, store: $('#pdStore').value.trim().slice(0, 40)})) {
        const pref = $('#pdStore').value.trim().slice(0, 40);
        for (const i of state.items.filter(i => !i.done && canon(i.name) === k && !i.store && pref)) await write(() => db.doc('items/' + i.id).update({store: pref}));
        toast('Produit enregistré ✓'); closeSheet('prodOv');
      }
      break; }
    case 'pdMerge': {
      const src = el.dataset.k, dst = $('#pdMerge').value; if (!dst) { toast('Choisis le produit avec lequel fusionner'); return; }
      const idx = priceIndex(); const a = idx.get(src), b = idx.get(dst);
      if (!(await confirmBox(`Fusionner « ${a.name} » dans « ${b.name} » ?\nLeurs prix et achats seront regroupés. Tu pourras les séparer plus tard.`, 'Fusionner'))) return;
      const srcDoc = state.products.find(p => p.key === src) || {};
      const dstDoc = state.products.find(p => p.key === dst) || {key: dst, aliases: []};
      const aliases = [...new Set([...(dstDoc.aliases || []), src, ...(srcDoc.aliases || [])])].filter(x => x !== dst);
      if (await saveProduct(dst, {aliases, cat: dstDoc.cat || srcDoc.cat || '', store: dstDoc.store || srcDoc.store || ''})) {
        if (state.products.some(p => p.key === src)) await write(() => db.doc('products/' + pdocId(src)).delete());
        toast('Fusionné ✓'); closeSheet('prodOv'); setTimeout(() => openProd(dst), 400);
      }
      break; }
    case 'pdUnmerge': {
      const k = el.dataset.k; if (!(await confirmBox('Séparer tous les produits regroupés ici ?', 'Séparer'))) return;
      if (await saveProduct(k, {aliases: []})) { toast('Séparés ✓'); closeSheet('prodOv'); }
      break; }
    case 'pdUnwatch': { const k = el.dataset.k; for (const w of state.watch.filter(w => canon(w.name) === k)) await write(() => db.doc('watch/' + w.id).delete()); closeSheet('prodOv'); toast('🔕 Plus surveillé'); break; }
    case 'newProject': openProject(null); break;
    case 'openProject': openProject(id); break;
    case 'saveProject': saveProject(); break;
    case 'delProject': {
      const pid = $('#projOv').dataset.pid; const p = state.projects.find(x => x.id === pid); if (!p) return;
      const n = projStats(pid).recs.length;
      if (!(await confirmBox(`Supprimer le projet « ${p.name} » ?${n ? `\nSes ${n} dépense(s) sont conservées et passent dans « Sans projet ».` : ''}`, 'Supprimer'))) return;
      const {id: _i, ...data} = p;
      if (await moveToTrash('projects', pid, data, `Projet : ${p.name}`)) { for (const r of projStats(pid).recs) await write(() => db.doc('receipts/' + r.id).update({project: ''})); closeSheet(); toast('Projet mis à la corbeille'); }
      break; }
    case 'openUtil': openUtil(el.dataset.k); break;
    case 'pickWho': pickWho(el.dataset.p); break;
    case 'whoSheet': openWho(false); break;
    case 'group': state.listGroup = el.dataset.g; ls.set('nc_group', state.listGroup); renderList(); break;
    case 'editItem': openItem(id); break;
    case 'pickStore': $('#iStore').value = el.dataset.s; break;
    case 'saveItem': {
      const name = $('#iName').value.trim().slice(0, 80); if (!name) return;
      if (await write(() => db.doc('items/' + id).update({name, qty: $('#iQty').value.trim().slice(0, 12), store: $('#iStore').value.trim().slice(0, 40), cat: guessCat(name)}))) closeSheet('itemOv');
      break; }
    case 'watchItem': await addWatch(el.dataset.name); closeSheet('itemOv'); closeSheet('prodOv'); break;
    case 'watchList': for (const i of state.items.filter(i => !i.done && !state.watch.some(w => norm(w.name) === norm(i.name)))) await addWatch(i.name); break;
    case 'rmWatch': await write(() => db.doc('watch/' + id).delete()); break;
    case 'newTransfer': openTransfer(null); break;
    case 'openTransfer': { const t = state.transfers.find(x => x.id === id); if (t) openTransfer(t); break; }
    case 'saveTransfer': saveTransfer(); break;
    case 'delTransfer': {
      const ov = $('#trOv'); const t = state.transfers.find(x => x.id === ov.dataset.id); if (!t) return;
      if (!(await confirmBox('Supprimer ce virement ? (récupérable dans la corbeille)', 'Supprimer'))) return;
      const {id: _i, ...data} = t;
      if (await moveToTrash('transfers', t.id, data, `Virement ${pname(t.from)} → ${pname(t.to)} · ${fmtDate(t.date)} · ${eur(t.amount)}`)) { if (t.recId) await skipAuto(t.recId, t.id); closeSheet('trOv'); toast('Mis à la corbeille'); }
      break; }
    case 'settleAll': { const n1 = balance(); const deb = n1 > 0 ? 'p2' : 'p1'; openTransfer(null, {from: deb, amount: Math.abs(n1), note: 'Solde des comptes'}); break; }
    case 'payBack': { const st = settleOf({id: draft.id, total: num($('#fTotal').value), payer: $('#fPayer').value, split: $('#fSplit').value, pctP1: num($('#fPct').value)}); if (st) openTransfer(null, {from: st.debtor, amount: st.rest, rid: draft.id, note: 'Ma part · ' + ($('#fStore').value || '')}); break; }
    case 'newRecurring': openRecurring(null); break;
    case 'openRecurring': { const rc = state.recurring.find(x => x.id === id); if (rc) openRecurring(rc); break; }
    case 'saveRecurring': saveRecurring(); break;
    case 'delRecurring': {
      const ov = $('#recurOv'); const rc = state.recurring.find(x => x.id === ov.dataset.id); if (!rc) return;
      if (!(await confirmBox('Supprimer cette opération récurrente ?\nLes opérations déjà créées sont conservées.', 'Supprimer'))) return;
      const {id: _i, ...data} = rc;
      if (await moveToTrash('recurring', rc.id, data, `Récurrent : ${rc.store || rc.label || ''} · ${eur(rc.amount)}`)) { closeSheet('recurOv'); toast('Supprimé'); }
      break; }
    case 'hideNag': state.hideBackupNag = true; $$('#nag').forEach(n => n.innerHTML = ''); break;
    case 'goBackup': setTimeout(() => $('#backupSec')?.scrollIntoView({behavior: 'smooth'}), 120); break;
    case 'backupZip': backupZip(el); break;
    case 'exportXlsx': exportXlsx(el); break;
    case 'snapNow': el.disabled = true; await autoSnapshot(true); el.disabled = false; break;
    case 'snapDl': { try { const d = await loadSnapshot(id); await saveFile(`taniere-pinpinrex-copie-${id}.json`, JSON.stringify(d, null, 1)); } catch (e) { toast('Copie illisible : ' + (e?.message || e)); } break; }
    case 'snapRestore': { try { const d = await loadSnapshot(id); await restoreData(d, null); } catch (e) { toast('Copie illisible : ' + (e?.message || e)); } break; }
    case 'restoreTrash': {
      const t = state.trash.find(x => x.id === id); if (!t) return;
      if (await write(() => db.collection(t.col).doc(t.docId).set(t.data))) { await write(() => db.doc('trash/' + id).delete()); toast('Récupéré ✓'); }
      break; }
    case 'emptyTrash': {
      if (!(await confirmBox(`Supprimer définitivement ${state.trash.length} élément(s) et leurs photos ?\nPense à faire une sauvegarde avant.`, 'Vider'))) return;
      const keepPhotos = new Set(state.receipts.map(r => r.photo).filter(Boolean));
      for (const t of [...state.trash]) {
        if (await write(() => db.doc('trash/' + t.id).delete())) { const ph = t.data?.photo; if (ph && assets && !keepPhotos.has(ph)) assets.delete(ph).catch(() => {}); }
      }
      toast('Corbeille vidée'); break; }
  }
});

/* ================= démarrage ================= */
function setSync(kind, txt) { $('#syncDot').className = 'dot ' + kind; $('#syncTxt').textContent = txt; }
setView(location.hash.slice(1) || 'liste');

(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { setSync('bad', 'Hors ligne'); main.insertAdjacentHTML('afterbegin', `<div class="banner">Ouvre cette appli depuis son lien claude.ai pour la synchronisation.</div>`); return; }
  db = await c.use('db');
  if (!db) { setSync('bad', 'Non connecté'); main.insertAdjacentHTML('afterbegin', `<div class="banner">Connecte-toi à Claude pour voir et synchroniser vos données.</div>`); return; }
  c.use('assets').then(a => { assets = a; });
  c.use('downloads').then(d => { downloads = d; if (state.view === 'bilan') renderBackupInfo(); });
  c.use('sample').then(async s => { sample = s; try { canSample = !!s && !!(await s.limits())?.images; } catch { canSample = !!s; } if (draft) renderAI(); });
  c.use('user').then(async u => {
    try { if ((await u?.can?.('data.write')) === false) main.insertAdjacentHTML('afterbegin', `<div class="banner">Lecture seule : demande un accès « Éditeur » pour modifier.</div>`); } catch {}
    try { state.uid = (await u?.id?.()) || null; } catch {}
    applyIdentity();
  });

  const timer = setTimeout(() => { if (!state.loaded.items || !state.loaded.receipts) setSync('bad', 'Données injoignables pour l\'instant'); }, 10000);
  const ready = () => { if (state.loaded.items && state.loaded.receipts && state.loaded.projects) { clearTimeout(timer); setSync('ok', 'Synchronisé'); setTimeout(() => autoSnapshot(false), 3000); } };
  const onErr = e => { clearTimeout(timer); setSync('bad', e?.code === 'revoked' ? 'Accès retiré' : 'Synchro interrompue'); };

  db.collection('items').onSnapshot(s => { state.items = s.docs.map(d => ({id: d.id, ...d.data()})); state.loaded.items = true; ready(); if (state.view === 'liste') renderList(); }, onErr);
  db.collection('receipts').onSnapshot(s => {
    state.receipts = s.docs.map(d => normalizeRec({id: d.id, ...d.data()})).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
    state.loaded.receipts = true; _pidx = null; ready(); scheduleGen(); refresh();
  }, onErr);
  db.collection('projects').onSnapshot(s => { state.projects = s.docs.map(d => ({id: d.id, ...d.data()})); state.loaded.projects = true; ready(); refresh(); }, onErr);
  db.collection('snapshots').onSnapshot(s => { state.snaps = s.docs.map(d => ({id: d.id, ...d.data()})); const first = !state.loaded.snaps; state.loaded.snaps = true; if (state.view === 'bilan') renderSnaps(); if (first) setTimeout(() => autoSnapshot(false), 3000); }, () => { state.loaded.snaps = false; });
  db.collection('transfers').onSnapshot(s => { state.transfers = s.docs.map(d => ({id: d.id, ...d.data()})); state.loaded.transfers = true; scheduleGen(); refresh(); }, () => {});
  db.collection('recurring').onSnapshot(s => { state.recurring = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.type === 'virement') - (b.type === 'virement') || (a.createdAt || 0) - (b.createdAt || 0)); state.loaded.recurring = true; scheduleGen(); refresh(); }, () => {});
  db.collection('bankImports').onSnapshot(s => { state.bankImports = s.docs.map(d => ({id: d.id, ...d.data()})); state.loaded.bank = true; if (state.view === 'bilan') refresh(); }, () => {});
  db.collection('warranties').onSnapshot(s => { state.warranties = s.docs.map(d => ({id: d.id, ...d.data()})); state.loaded.warranties = true; if (state.view === 'travaux') refresh(); else updatePip(); }, () => {});
  db.collection('incomes').onSnapshot(s => { state.incomes = s.docs.map(d => ({id: d.id, ...d.data()})); state.loaded.incomes = true; scheduleGen(); if (state.view === 'bilan') refresh(); }, () => { state.loaded.incomes = true; });
  db.collection('goals').onSnapshot(s => { state.goals = s.docs.map(d => ({id: d.id, ...d.data()})); state.loaded.goals = true; if (state.view === 'bilan') refresh(); }, () => {});
  db.collection('products').onSnapshot(s => { state.products = s.docs.map(d => ({id: d.id, ...d.data()})); _pidx = null; if (['courses', 'liste'].includes(state.view)) refresh(); }, () => {});
  db.collection('watch').onSnapshot(s => { state.watch = s.docs.map(d => ({id: d.id, ...d.data()})).sort((a, b) => (a.at || 0) - (b.at || 0)); _pidx = null; if (state.view === 'courses') refresh(); }, () => {});
  db.collection('promos').onSnapshot(s => { state.promos = s.docs.map(d => ({id: d.id, ...d.data()})); if (state.view === 'courses' || state.view === 'liste') refresh(); }, () => {});
  db.doc('meta/promoDigest').onSnapshot(s => { state.digest = s.exists ? s.data() : null; if (state.view === 'courses') refresh(); }, () => {});
  db.collection('trash').onSnapshot(s => { state.trash = s.docs.map(d => ({id: d.id, ...d.data()})); if (state.view === 'bilan') renderTrash(); }, () => {});
  db.doc('settings/main').onSnapshot(s => { if (s.exists) Object.assign(state.settings, s.data()); state.loaded.settings = true; applyIdentity(); refresh(); }, () => {});
})();
</script>
