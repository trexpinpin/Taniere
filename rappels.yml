name: Rappels quotidiens

on:
  schedule:
    - cron: '0 7 * * *'   # tous les jours à 7 h UTC = 8 h en hiver / 9 h en été (Belgique)
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test à tout le monde'
        type: boolean
        default: true

jobs:
  rappels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer
        run: npm install --prefix rappels --no-audit --no-fund
      - name: Envoyer les rappels
        run: node rappels/rappels.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: ${{ vars.APP_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
